<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f5fa"/><stop offset="1" stop-color="#eef1f8"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#515c76"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12Z" fill="#515c76"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="24" fill="url(#bg)"/>
  <text x="500" y="54" text-anchor="middle" font-family="Sora, sans-serif" font-size="28" font-weight="700" fill="#0d1220">MOOTECH — conceptual system flow</text>
  <text x="500" y="82" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" fill="#6b6a5c">Based on the final-year research README</text>

  <g>
    <rect x="46" y="180" width="190" height="150" rx="20" fill="url(#node)"/>
    <text x="141" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="700" fill="#fff">Wearable IoT</text>
    <text x="141" y="266" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#ffffff">Real-time vitals</text>
    <text x="141" y="288" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#ffffff">&amp; activity</text>
  </g>

  <g>
    <rect x="298" y="180" width="190" height="150" rx="20" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <text x="393" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="700" fill="#0d1220">Cloud</text>
    <text x="393" y="266" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#6b6a5c">Storage, processing</text>
    <text x="393" y="288" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#6b6a5c">&amp; remote access</text>
  </g>

  <g>
    <rect x="550" y="180" width="190" height="150" rx="20" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <text x="645" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="700" fill="#0d1220">Machine learning</text>
    <text x="645" y="266" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#6b6a5c">Trend analysis</text>
    <text x="645" y="288" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#6b6a5c">&amp; yield prediction</text>
  </g>

  <g>
    <rect x="802" y="180" width="152" height="150" rx="20" fill="url(#node)"/>
    <text x="878" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="700" fill="#fff">Image-based</text>
    <text x="878" y="266" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#ffffff">YOLO-supported</text>
    <text x="878" y="288" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#ffffff">detection</text>
  </g>

  <g stroke="#515c76" stroke-width="3" marker-end="url(#arrow)">
    <path d="M240 255 H290"/>
    <path d="M492 255 H542"/>
    <path d="M744 255 H794"/>
  </g>

  <rect x="298" y="390" width="404" height="70" rx="18" fill="#8b5cf6" opacity="0.12" stroke="#a78bfa"/>
  <text x="500" y="420" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" font-weight="700" fill="#0d1220">Web application for remote monitoring</text>
  <text x="500" y="442" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#6b6a5c">Data flow illustration — not an experimental result</text>
  <path d="M393 335 V382" stroke="#515c76" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
